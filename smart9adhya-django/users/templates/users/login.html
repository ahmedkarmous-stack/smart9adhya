{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <span style="font-size: 3rem;">🔥</span>
                    <h2 class="text-gradient mt-2">Welcome Back</h2>
                    <p class="text-muted">Sign in to continue shopping</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="username" class="form-control" placeholder="your@email.com" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    
                    {% if form.errors %}
                    <div class="alert alert-danger py-2">
                        <small>Invalid email or password</small>
                    </div>
                    {% endif %}
                    
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted mb-0">Don't have an account? 
                        <a href="{% url 'users:register' %}" class="text-primary">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
